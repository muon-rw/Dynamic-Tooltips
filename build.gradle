plugins {
	id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
	id 'dev.mixinmcp.decompile' version '1.0.2'
}

// Snapshot publishing is selected by running any task whose name contains "snapshot"
// (e.g. `publishToSnapshots`) or by passing `-Psnapshot=true`. Reposilite treats
// `-SNAPSHOT` versions as mutable, so republishing the same version updates the artifact —
// mirroring the `mavenLocal()` workflow across machines via `maven.muon.rip/snapshots/`.
def isSnapshotPublish = gradle.startParameter.taskNames.any { it.toLowerCase().contains('snapshot') } || project.hasProperty('snapshot')
version = isSnapshotPublish
		? "${project.mod_version}+${project.minecraft_version}-SNAPSHOT"
		: "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.parchmentmc.org' }
	maven { url 'https://jitpack.io' }
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url "https://cursemaven.com" }
	maven { url "https://maven.terraformersmc.com/"}
	maven { url "https://maven.fzzyhmstrs.me/" }
	maven { url = "https://maven.bawnorton.com/releases" }
	maven { url = "https://repo.redlance.org/public" }
	maven {
		url = 'https://maven.muon.rip/snapshots/'
		content { includeGroupAndSubgroups 'dev.muon' }
	}
	maven {
		url = 'https://maven.muon.rip/releases/'
		content { includeGroupAndSubgroups 'dev.muon' }
	}
}

// Re-check -SNAPSHOT metadata on every build (default TTL is 24h). Only affects
// changing modules; release coords stay fully cached. Pair with the snapshots repo
// content filter above so this only impacts dev.muon resolution.
configurations.all {
	resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// FzzyConfig — replaces YACL/FCAP. Excluded transitives match DD.
	implementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}") {
		exclude(group: "me.lucko")
		exclude(group: "com.terraformersmc")
	}

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	// MixinSquared — sponge-mixin and mixin-extras APs are auto-registered by Loom for Fabric.
	// MixinSquared's AP MUST be declared before Mixin's runs; we just register the jar.
	implementation(include(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixin_squared_version}")))

	// Compatibility Testing — NOT YET UPDATED for 26.1.2, uncomment when available
	// modImplementation "curse.maven:better-combat-by-daedelus-639842:7359188"
	// modLocalRuntime "curse.maven:tieredz-615948:6130503"
	// modLocalRuntime "curse.maven:libz-841617:5712924"
	// modLocalRuntime "curse.maven:cloth-config-348521:5729125"
	// modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:$project.pal_version"
	// modLocalRuntime("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric")
	// modImplementation "curse.maven:ranged-weapon-api-962162:6077072"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Only the matching repo is registered so a stray `./gradlew publish` can't push
		// a non-SNAPSHOT artifact at the snapshots URL (or vice versa). Use the
		// `publishToSnapshots` / `publishToReleases` aggregators rather than `publish`.
		if (isSnapshotPublish) {
			maven {
				name = 'muonSnapshots'
				url = System.getenv('SNAPSHOT_MAVEN_URL') ?: 'https://maven.muon.rip/snapshots/'
				credentials {
					username = System.getenv('MAVEN_USERNAME')
					password = System.getenv('MAVEN_PASSWORD')
				}
			}
		} else {
			maven {
				name = 'muonReleases'
				url = System.getenv('MAVEN_URL') ?: 'https://maven.muon.rip/releases/'
				credentials {
					username = System.getenv('MAVEN_USERNAME')
					password = System.getenv('MAVEN_PASSWORD')
				}
			}
		}
	}
}

// Maven publish aggregators. Run `./gradlew publishToSnapshots` to push a `-SNAPSHOT`
// artifact (republishable, refreshes consumers per cacheChangingModulesFor); run
// `publishToReleases` for an immutable release. Mode is detected by task name above.
tasks.register('publishToSnapshots') {
	group = 'publishing'
	description = 'Publish to maven.muon.rip/snapshots with -SNAPSHOT suffix.'
	dependsOn 'publishMavenJavaPublicationToMuonSnapshotsRepository'
}

tasks.register('publishToReleases') {
	group = 'publishing'
	description = 'Publish to maven.muon.rip/releases.'
	dependsOn 'publishMavenJavaPublicationToMuonReleasesRepository'
}

publishMods {
	file = jar.archiveFile
	type = STABLE
	modLoaders.add("fabric")
	changelog = new File("$project.rootDir/changelog.md").getText('UTF-8')

	curseforge {
		projectId = "1247062"
		projectSlug = "dynamic-tooltips"
		accessToken = providers.environmentVariable("CF_TOKEN")
		minecraftVersions.add("${minecraft_version}")
		requires("fabric-api")
		requires("fzzy-config")
		clientRequired = true
		serverRequired = false
	}
	modrinth {
		projectId = "yakHVeQt"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.add("${minecraft_version}")
		requires("fabric-api")
		requires("fzzy-config")
	}
}
