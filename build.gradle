plugins {
	id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
	id 'dev.mixinmcp.decompile' version '0.8.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.parchmentmc.org' }
	maven { url 'https://jitpack.io' }
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url "https://cursemaven.com" }
	maven { url "https://maven.terraformersmc.com/"}
	maven { url "https://maven.fzzyhmstrs.me/" }
	maven { url = "https://maven.bawnorton.com/releases" }
	maven { url = "https://repo.redlance.org/public" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// FzzyConfig — replaces YACL/FCAP. Excluded transitives match DD.
	implementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}") {
		exclude(group: "me.lucko")
		exclude(group: "com.terraformersmc")
	}

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")

	// MixinSquared — sponge-mixin and mixin-extras APs are auto-registered by Loom for Fabric.
	// MixinSquared's AP MUST be declared before Mixin's runs; we just register the jar.
	implementation(include(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixin_squared_version}")))

	// Compatibility Testing — NOT YET UPDATED for 26.1.2, uncomment when available
	// modImplementation "curse.maven:better-combat-by-daedelus-639842:7359188"
	// modLocalRuntime "curse.maven:tieredz-615948:6130503"
	// modLocalRuntime "curse.maven:libz-841617:5712924"
	// modLocalRuntime "curse.maven:cloth-config-348521:5729125"
	// modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:$project.pal_version"
	// modLocalRuntime("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric")
	// modImplementation "curse.maven:ranged-weapon-api-962162:6077072"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		maven {
			url System.getenv('MAVEN_URL')
			credentials {
				username = System.getenv("MAVEN_USERNAME")
				password = System.getenv("MAVEN_PASSWORD")
			}
		}
	}
}

publishMods {
	file = jar.archiveFile
	type = STABLE
	modLoaders.add("fabric")
	changelog = new File("$project.rootDir/changelog.md").getText('UTF-8')

	curseforge {
		projectId = "1247062"
		projectSlug = "dynamic-tooltips"
		accessToken = providers.environmentVariable("CF_TOKEN")
		minecraftVersions.add("${minecraft_version}")
		requires("fabric-api")
		requires("fzzy-config")
		clientRequired = true
		serverRequired = false
	}
	modrinth {
		projectId = "yakHVeQt"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.add("${minecraft_version}")
		requires("fabric-api")
		requires("fzzy-config")
	}
}
